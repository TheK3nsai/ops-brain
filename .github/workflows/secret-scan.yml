name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` so a body rewritten after opening is rescanned.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  scan:
    name: Fleet-private string guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the commit-message step can walk the range.
          fetch-depth: 0

      # The denylist is a set of salted SHA-256 digests in
      # `.github/fleet-denylist.sha256` — this workflow no longer enumerates
      # the strings it protects, which on a public repo made it the single
      # best place to look for exactly those values.
      #
      # The scan reads the whole tracked tree, not added diff lines. A
      # delta-only guard never reads the tree it inherited, so it certifies a
      # dirty default branch green forever — which is how this one stayed
      # green for four months over a `main` carrying every guarded class.
      # Runs against synthetic guarded values, so a guard regression is caught
      # here rather than by the guard silently passing a dirty tree.
      - name: Test the guard
        run: .github/scripts/test_fleet_string_guard.py

      - name: Scan tree for fleet-private strings
        run: .github/scripts/fleet_string_guard.py

      # Commit messages and PR text are the surfaces that leaked (PR #116's
      # message and body passed a clean tree). These steps run after that text
      # is already public, so they detect rather than prevent. Prevention is
      # local: `.githooks/commit-msg`, plus agent hooks on gh/MCP writes.
      # Event text arrives through env, never interpolated into the script.
      # `!cancelled()`: a dirty tree must not hide findings in the text.
      # Branch names are public too, and often built from task text.
      - name: Scan PR title, body and branch name
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BODY" "$PR_BRANCH" | .github/scripts/fleet_string_guard.py --text

      # The pushed/PR commit range, shared by the message and token scans.
      # Never the whole history: merged history still carries pre-scrub
      # messages. The explicit check makes a force-push (which leaves `before`
      # outside the clone) an error rather than an empty "Clean"; the steps
      # below then skip, and this step's failure fails the job.
      - name: Resolve commit range
        id: range
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "::error::push base $PUSH_BEFORE is not in the clone (force-push?); scan the new commits by hand"
              exit 1
            fi
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="-1 $GITHUB_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      # Author/committer identity is public with the message (an unset
      # user.email falls back to user@<fqdn>). pipefail: a failed `git log`
      # must be an error, not an empty "Clean".
      - name: Scan commit messages and identities
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          read -ra range <<< "$RANGE"
          git log --format='%an <%ae>%n%cn <%ce>%n%B' "${range[@]}" | .github/scripts/fleet_string_guard.py --text

      # Token scan over the same range. The fleet guard above knows only
      # fleet identifiers; this catches keys and tokens. Locally the same scan
      # runs on staged changes from `.githooks/pre-commit`. Pinned release
      # binary, checksum from the release's checksums file. Reviewed false
      # positives live in `.gitleaksignore` by exact fingerprint.
      - name: Install gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan commit range for tokens (gitleaks)
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        shell: bash
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: gitleaks git --redact --verbose --no-banner --log-opts="$RANGE" .

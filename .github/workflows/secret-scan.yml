name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Fleet-private string guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The denylist is a set of salted SHA-256 digests in
      # `.github/fleet-denylist.sha256` — this workflow no longer enumerates
      # the strings it protects, which on a public repo made it the single
      # best place to look for exactly those values.
      #
      # The scan reads the whole tracked tree, not added diff lines. A
      # delta-only guard never reads the tree it inherited, so it certifies a
      # dirty default branch green forever — which is how this one stayed
      # green for four months over a `main` carrying every guarded class.
      # Runs against synthetic guarded values, so a guard regression is caught
      # here rather than by the guard silently passing a dirty tree.
      - name: Test the guard
        run: .github/scripts/test_fleet_string_guard.py

      - name: Scan tree for fleet-private strings
        run: .github/scripts/fleet_string_guard.py

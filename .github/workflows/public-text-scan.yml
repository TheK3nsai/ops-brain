name: Public text scan

on:
  # Unlike pull_request, this runs even when the PR conflicts with its base.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  text:
    name: Public text string guard
    runs-on: ubuntu-latest
    steps:
      # ONLY the trusted default branch: never fetch, import or execute PR code.
      # Event text stays in the event JSON; it is never interpolated into shell.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Scan public event text
        run: python3 .github/scripts/fleet_string_guard.py --github-event "$GITHUB_EVENT_PATH"

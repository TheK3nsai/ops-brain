# ops-brain — Production deployment (shared PostgreSQL)
# Assumes PostgreSQL + pgvector already running on shared-db network
# Reverse proxy handles routing (add to Caddy/Traefik/nginx config)

services:
  ops-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops-brain
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      # DO NOT add `replicas:` here — the /live messaging lane keeps its peer
      # registry in process memory (src/live.rs LiveHub), so peers are visible
      # only to the replica that holds their WebSocket. A second replica would
      # split the registry: list_live_peers would intermittently omit peers and
      # send_live_message would fail `not_found` for a peer that is genuinely
      # connected — load-balanced, so it would look like a flaky network rather
      # than a topology error. Live must stay single-replica until the registry
      # is externalised. Verified 2026-08-14 during the fleet acceptance gate.
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
    environment:
      - DATABASE_URL=postgresql://ops_brain:${OPS_BRAIN_DB_PASSWORD}@shared-postgres:5432/ops_brain
      - OPS_BRAIN_TRANSPORT=http
      - OPS_BRAIN_LISTEN=0.0.0.0:3000
      - OPS_BRAIN_AUTH_TOKEN=${OPS_BRAIN_AUTH_TOKEN:?OPS_BRAIN_AUTH_TOKEN must be set — refusing to start unauthenticated}
      # Scoped machine tokens (JSON array) for POST /api/handoff + GET /api/pending
      - OPS_BRAIN_MACHINE_TOKENS=${OPS_BRAIN_MACHINE_TOKENS:-}
      # Per-agent tokens (JSON array): identity-bound /mcp sessions (see docs/agent-tokens.md)
      - OPS_BRAIN_AGENT_TOKENS=${OPS_BRAIN_AGENT_TOKENS:-}
      - OPS_BRAIN_MIGRATE=true
      # rmcp 1.4+ Host header allowlist (DNS-rebind mitigation, default loopback-only)
      - OPS_BRAIN_ALLOWED_HOSTS=${OPS_BRAIN_ALLOWED_HOSTS:-}
      # Embeddings (ollama on same Docker network)
      - OPS_BRAIN_EMBEDDING_URL=http://ollama:11434/v1/embeddings
      - OPS_BRAIN_EMBEDDING_MODEL=nomic-embed-text
      - OPS_BRAIN_EMBEDDING_API_KEY=${OPS_BRAIN_EMBEDDING_API_KEY:-}
      # rmcp=info surfaces session lifecycle (create/KeepAliveTimeout) in `docker logs`
      - RUST_LOG=${RUST_LOG:-ops_brain=info,rmcp=info}
    networks:
      - web-net
      - shared-db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      # Auth history must outlive the container. The default json-file log is
      # owned by the container and destroyed on recreate, so every
      # `docker compose up -d --build` silently discards the entire auth
      # history — and a deploy is often the response TO an auth incident, which
      # made the 2026-08-10 401 review impossible rather than merely awkward.
      # journald puts the stream under the host journal (capped 500M / 1 month),
      # where it survives recreate and is queryable by tag.
      #
      # Verified on kensai-cloud 2026-08-31 against a throwaway container before
      # this was applied to prod: `docker logs`, including the `--tail N
      # --since Nm` forms the deploy skill and kuma-watchdog use, behaves
      # identically; and `journalctl -t ops-brain` still returns the stream
      # after the container is removed. `docker logs` remains scoped to the
      # CURRENT container — the added retention is on the journalctl side, so
      # reach for that when reviewing anything from before the last deploy.
      driver: journald
      options:
        tag: ops-brain
    labels:
      # Locally-built image (no registry) — exclude from diun's watch-by-default
      # so it stops probing a non-existent repo and logging daily "access denied".
      # Base-image (Dockerfile FROM) updates are covered by Dependabot, not diun.
      diun.enable: "false"

networks:
  web-net:
    external: true
  shared-db:
    external: true
